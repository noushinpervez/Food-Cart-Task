<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Cart</title>
  
  <!-- Montserrat font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <style>
    .montserrat {
      font-family: "Montserrat", sans-serif;
    }
  </style>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom Tailwind Configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            headerBg: "#dfdedd",
            primary: "#eb4f3e",
            textColor: "#070707",
            disabled: "#5e6571",
            light: "#eeeeee",
          },
        },
      },
    };
  </script>
</head>

<body class="bg-light text-textColor antialiased box-border scroll-smooth montserrat">
  
  <header>
    <!-- Navbar section -->
    <nav class="bg-headerBg border-t-4 border-primary">
      <div class="max-w-4xl mx-auto px-4">
        <div class="flex justify-between items-center">
          <div class="flex items-center space-x-1">
            <!-- Logo -->
            <a href="#" class="flex items-center">
              <img class="w-16 h-16" src="./resources/logo.svg" alt="Logo" />
            </a>
            <!-- Primary Navigation -->
            <div class="hidden md:flex font-medium text-sm uppercase">
              <a href="#" class="px-1.5 hover:text-primary">Menu</a>
              <a href="#" class="px-1.5 hover:text-primary">Rewards</a>
              <a href="#" class="px-1.5 hover:text-primary">Locations</a>
              <a href="#" class="px-1.5 hover:text-primary">Gift Cards</a>
              <a href="#" class="px-1.5 hover:text-primary">Log in</a>
            </div>
          </div>

          <!-- Cart and Order Now Button -->
          <div class="flex items-center space-x-1">
            <!-- Cart Button with Badge -->
            <button class="relative px-1.5">
              <img class="w-8 h-8" src="./resources/bag.png" alt="Bag icon" />
              <!-- Cart Count Badge -->
              <span class="absolute top-0 right-0 -mt-1 mr-1 bg-primary text-light text-[10px] font-medium px-2 py-1 rounded-md">1</span>
            </button>

            <!-- Order Now Button -->
            <button class="py-3 md:px-7 px-4 bg-primary hover:bg-disabled text-xs text-light font-bold rounded-md transition duration-300 uppercase">
              Order Now
            </button>

            <!-- Mobile Menu Button -->
            <div class="md:hidden flex items-center pl-2">
              <button class="mobile-menu-button">
                <svg class="w-6 h-6 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Mobile Menu -->
      <div class="mobile-menu hidden md:hidden text-sm font-medium uppercase">
        <a href="#" class="block py-2 px-4 hover:bg-primary">Menu</a>
        <a href="#" class="block py-2 px-4 hover:bg-primary">Rewards</a>
        <a href="#" class="block py-2 px-4 hover:bg-primary">Locations</a>
        <a href="#" class="block py-2 px-4 hover:bg-primary">Gift Cards</a>
        <a href="#" class="block py-2 px-4 hover:bg-primary">Log in</a>
      </div>
    </nav>
  </header>

  <!-- Content Section -->
  <main class="text-center max-w-6xl mx-auto p-4">
    <h2 class="font-semibold text-3xl text-primary uppercase">Chicken Crisper® Combos</h2>
  </main>

  <!-- Scripts -->
  <script src="./scripts/app.js"></script>
</body>
</html>
